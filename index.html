<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tuaka</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.box {
   z-index: 2;
    width: 100%;
    Height: 100vh;
    text-align: center;
    padding: 30px;
}

h2 {
    color: #a974f4;
}

#ip {
    font-size: 24px;
    font-weight: bold;
    margin-top: 15px;
    word-break: break-all;
    color: white;
}

.status {
    margin-top: 15px;
    color: #aaa;
}

/* Message */
#message {
    margin-top: 15px;
    font-weight: bold;
    display: none;
}

#message.success {
    color: #22c55e;
}

#message.error {
    color: #ff3333;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.container{
    width:100%;
    height: 100vh;
   height: 100dvh;
    border:none;
}

.floatBtn{
    position:fixed;
    left:80px;
    top:300px;
    width:40px;
    height:40px;
    border:none;
    border-radius:30px;
    outline:none;
    text-align: center;
    color:#fff;
    font-size: 19px;
    background:#000;
    z-index:9999;
}

.floatBtn::placeholder{
    color:#fff;
}

.recheck-btn {
    display: ;
    align-items: center;
    justify-content: center;
    gap: 8px;

    padding: 12px 22px;
    border: 1px solid #4B0082;
    border-radius: 12px;

    background: #111;
    color: #fff;

    font-size: 15px;
    font-weight: 600;
    font-family: Arial, sans-serif;

    cursor: pointer;
    transition: all 0.2s ease;
}

.recheck-btn:hover {
    background: #4B0082;
    transform: translateY(-1px);
}

.recheck-btn:active {
    transform: scale(0.96);
}

.recheck-icon {
    font-size: 20px;
    line-height: 1;
}
</style>
</head>

<body>

<div id="box1" class="box" style="display: ;">
<h2 style="margin-top: 50%;">Your Current IP Address</h2>

<div id="ip">Loading...</div>

<div class="status" id="status">
    Checking your public IP...
</div>

<div id="message"></div>

<button style="margin-top: 10%;" class="recheck-btn" onclick="recheck()">
    <span class="recheck-icon">↻</span>
    Recheck
</button>
</div>

<iframe id="site" class="container" style="display: ;"
 src=""
allow="clipboard-write">
</iframe>

<input
id="floatBtn"
class="floatBtn"
type="text"
placeholder="T">

<script>
 
document.getElementById("site").src ="";

const WORKER_URL =
    "https://tuaka-data.tuakapop.workers.dev";


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
}

let ipMonitor = null;

// ==========================================
// START IP MONITOR
// ==========================================

function startIPMonitor() {

    if (ipMonitor !== null) return;

    checkCurrentIP2();

    ipMonitor = setInterval(function() {
        checkCurrentIP2();
    }, 3000);

}


// ==========================================
// STOP IP MONITOR
// ==========================================

function stopIPMonitor() {

    if (ipMonitor === null) return;

    clearInterval(ipMonitor);

    ipMonitor = null;

}
stopIPMonitor();
// ==========================================
// MAIN FUNCTION
// ==========================================

let checkingIP = false;

async function checkCurrentIP() {

    if (checkingIP) return;

    checkingIP = true;

    try {

        // --------------------------------------
        // 1. GET PUBLIC IP
        // --------------------------------------

        const ipResponse = await fetch(
            "https://api.ipify.org?format=json"
        );

        if (!ipResponse.ok) {
            throw new Error("Unable to get IP");
        }

        const ipData = await ipResponse.json();

        const currentIP = ipData.ip;


        // --------------------------------------
        // 2. DISPLAY IP
        // --------------------------------------

        document.getElementById("ip").textContent =
            currentIP;


      

        // --------------------------------------
        // 4. CHECK IP IN CLOUDFLARE KV
        // --------------------------------------

        document.getElementById("status").textContent =
            "Checking IP against database...";

        const checkResponse = await fetch(
            WORKER_URL +
            "/check-ip?ip=" +
            encodeURIComponent(currentIP)
        );

        if (!checkResponse.ok) {
            throw new Error("Cloudflare check failed");
        }

        const result = await checkResponse.json();


        // --------------------------------------
        // 5. CHECK RESULT
        // --------------------------------------

        if (result.exists === true) {

            // IP ALREADY EXISTS

  stopIPMonitor();          document.getElementById("status").textContent =
                "IP address already exists";

            showMessage(
                "ERROR: This IP address is already stored.",
                "error"
            );

            document.getElementById("box1").style.display ="block";
            document.getElementById("site").src ="";

        } else {

            // IP DOES NOT EXIST
startIPMonitor();
            document.getElementById("status").textContent =
                "IP address is available";

            showMessage(
                "SUCCESS: This IP address is not stored.",
                "success"
            );


            // ----------------------------------
            // 6. SAVE NEW IP TO CLOUDFLARE
            // ----------------------------------

            const saveResponse = await fetch(
                WORKER_URL + "/save-ip",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        ip: currentIP
                    })
                }
            );


            if (!saveResponse.ok) {
                throw new Error("Unable to save IP");
            }

            const saveResult =
                await saveResponse.json();


            if (saveResult.success) {

                document.getElementById("status").textContent =
                    "IP checked and saved successfully";

                showMessage(
                    "SUCCESS: IP address saved successfully.",
                    "success"
                );

                document.getElementById("box1").style.display ="none";

                document.getElementById("site").src =
                    "https://famsuptasks.com";

            }

        }


    } catch (error) {

        console.error(error);

        document.getElementById("ip").textContent =
            "Unable to detect IP";

        document.getElementById("status").textContent =
            "IP check failed";

        showMessage(
            "ERROR: Unable to check your IP address.",
            "error"
        );

       startIPMonitor(); document.getElementById("box1").style.display ="none";

        document.getElementById("site").src =
            "https://famsuptasks.com";

    } finally {

        checkingIP = false;

    }

}


// ==========================================
// RUN WHEN PAGE LOADS
// ==========================================

checkCurrentIP();


function recheck() {
    checkCurrentIP();
}

let checkingIP2 = false;

async function checkCurrentIP2() {

    if (checkingIP2) return;

    checkingIP2 = true;

    try {

        // --------------------------------------
        // 1. GET PUBLIC IP
        // --------------------------------------

        const ipResponse = await fetch(
            "https://api.ipify.org?format=json"
        );

        if (!ipResponse.ok) {
            throw new Error("Unable to get IP");
        }

        const ipData = await ipResponse.json();

        const currentIP2 = ipData.ip;


        // --------------------------------------
        // 2. GET SAVED IP
        // --------------------------------------

        const savedIP = localStorage.getItem("savedIP");


        // --------------------------------------
        // 3. CHECK IF IP HAS CHANGED
        // --------------------------------------

        if (savedIP !== currentIP2) {

            // UPDATE LOCAL STORAGE

            localStorage.setItem("savedIP", currentIP2);


            // ----------------------------------
            // 4. CHECK IF IP ALREADY EXISTS
            // ----------------------------------

            const checkResponse = await fetch(
                WORKER_URL + "/check-ip?ip=" + encodeURIComponent(currentIP2)
            );

            if (!checkResponse.ok) {
                throw new Error("Cloudflare IP check failed");
            }

            const checkResult = await checkResponse.json();


            // ----------------------------------
            // 5. SAVE ONLY IF IP DOES NOT EXIST
            // ----------------------------------

            if (!checkResult.exists) {

                const saveResponse = await fetch(
                    WORKER_URL + "/save-ip",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            ip: currentIP2
                        })
                    }
                );

                if (!saveResponse.ok) {
                    throw new Error("Cloudflare save failed");
                }

                const saveResult = await saveResponse.json();

                if (!saveResult.success) {
                    throw new Error("Cloudflare did not save IP");
                }

                console.log(
                    "New IP saved to local storage and Cloudflare:",
                    currentIP2
                );

                
            } else {

                console.log(
                    "IP already exists in Cloudflare. Not saving again:",
                    currentIP2
                );

            }

        }

    } catch (error) {

        console.error("IP2 monitoring error:", error);

    } finally {

        checkingIP2 = false;

    }

}


// ==========================================
// FLOATING BUTTON
// ==========================================

const btn = document.getElementById("floatBtn");

let dragging = false;
let holdTimer;
let offsetX = 0;
let offsetY = 0;
let savedUsername = "";


// ==========================================
// CREATE T, Y, R AND CP BUTTONS
// ==========================================

const choiceBox = document.createElement("div");

choiceBox.style.position = "fixed";
choiceBox.style.display = "none";
choiceBox.style.zIndex = "99999";
choiceBox.style.gap = "8px";
choiceBox.style.alignItems = "center";

const tBtn = document.createElement("button");
const yBtn = document.createElement("button");
const rBtn = document.createElement("button");
const cpBtn = document.createElement("button");

tBtn.textContent = "T";
yBtn.textContent = "Y";
rBtn.textContent = "C";
cpBtn.textContent = "R";

[tBtn, yBtn, rBtn, cpBtn].forEach(button => {
    button.style.width = "42px";
    button.style.height = "42px";
    button.style.border = "none";
    button.style.borderRadius = "50%";
    button.style.background = "#222";
    button.style.color = "white";
    button.style.fontSize = "18px";
    button.style.fontWeight = "bold";
    button.style.boxShadow = "0 3px 12px rgba(0,0,0,.4)";
});

choiceBox.appendChild(tBtn);
choiceBox.appendChild(yBtn);
choiceBox.appendChild(rBtn);
choiceBox.appendChild(cpBtn);

document.body.appendChild(choiceBox);


// ==========================================
// POSITION BUTTONS
// ==========================================

function positionChoices(){

    const rect = btn.getBoundingClientRect();

    choiceBox.style.left = (rect.right + 10) + "px";
    choiceBox.style.top = (rect.top + rect.height / 2 - 21) + "px";

}


// ==========================================
// SHOW SELECTED BUTTONS
// ==========================================

function showChoices(buttons){

    choiceBox.innerHTML = "";

    buttons.forEach(button => {
        choiceBox.appendChild(button);
    });

    positionChoices();

    choiceBox.style.display = "flex";

}


// ==========================================
// HIDE BUTTONS
// ==========================================

function hideChoices(){

    choiceBox.style.display = "none";

}


// ==========================================
// HOLD BEFORE DRAGGING
// ==========================================

function startHold(e){

    const touch = e.touches ? e.touches[0] : e;

    offsetX = touch.clientX - btn.offsetLeft;
    offsetY = touch.clientY - btn.offsetTop;

    holdTimer = setTimeout(function(){

        dragging = true;

        btn.blur();

        navigator.vibrate?.(100);

    },200);

}


function move(e){

    if(!dragging)return;

    e.preventDefault();

    const touch = e.touches ? e.touches[0] : e;

    btn.style.left = (touch.clientX - offsetX) + "px";
    btn.style.top = (touch.clientY - offsetY) + "px";

    if(choiceBox.style.display !== "none"){
        positionChoices();
    }

}


function endDrag(){

    clearTimeout(holdTimer);

    if(dragging){
        dragging = false;
    }

}


btn.addEventListener("mousedown",startHold);
btn.addEventListener("touchstart",startHold);

document.addEventListener("mousemove",move);
document.addEventListener("touchmove",move,{passive:false});

document.addEventListener("mouseup",endDrag);
document.addEventListener("touchend",endDrag);


// ==========================================
// CLICK FLOATING T = SHOW R AND CP
// ==========================================

btn.addEventListener("click",function(){

    showChoices([rBtn, cpBtn]);

});


// ==========================================
// PASTE OR TYPE TEXT = SHOW T AND Y
// ==========================================

btn.addEventListener("input",function(){

    let username = this.value.trim();

    if(username === "") return;

    username = username.replace(/^@/, "");

    savedUsername = username;

    showChoices([tBtn, yBtn]);

    this.value = "";

});


// ==========================================
// T = TIKTOK PROFILE
// ==========================================

tBtn.addEventListener("click",function(){

    if(!savedUsername) return;

    const username = savedUsername.replace(/^@/, "").trim();

    hideChoices();

    window.location.href =
        "https://www.tiktok.com/@" + encodeURIComponent(username);

});


// ==========================================
// Y = YOUTUBE SEARCH
// ==========================================

yBtn.addEventListener("click",function(){

    if(!savedUsername) return;

    const username = savedUsername;

    hideChoices();

    window.location.href =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(username) +
        "&sp=EgIQAg%253D%253D";

});


// ==========================================
// R = RELOAD PAGE
// ==========================================

rBtn.addEventListener("click",function(){

    hideChoices();

    window.location.reload();

});


// ==========================================
// CP BUTTON
// ==========================================

cpBtn.addEventListener("click",function(){

    hideChoices();

document.getElementById("box1").style.display ="none";

                document.getElementById("site").src ="https://famsuptasks.com";
startIPMonitor();

});



</script>

</body>
</html>
